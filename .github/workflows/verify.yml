name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      LEAN_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: leanprover/lean-action@24581d74d674803a25a81b10b059c5c0cdd344c6
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Run supplied verifier
        run: python3 scripts/verify.py --serial
